name: salon_app
description: Beauty Platform salon panel.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  boya_shared:
    path: ../shared
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: 2.5.3
