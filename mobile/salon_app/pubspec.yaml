name: salon_app
description: Beauty Platform salon panel.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  boya_shared:
    path: ../shared
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.5.5
  # Session storage. The refresh token is long-lived and single-use, so it lives
  # in the platform keystore (Keychain / EncryptedSharedPreferences) rather than
  # a readable preferences file. Constraint matches boya_shared so pub resolves
  # one copy of the plugin instead of two.
  flutter_secure_storage: ^9.2.4
  # The booking detail's «تماس با مشتری» button opens the dialler with
  # `tel:`. It is the only place the app hands a URI to the OS, which is why
  # the dependency is here rather than in boya_shared.
  url_launcher: ^6.3.1
  # The dashboard's weekly-revenue chart. `boya_shared` also depends on fl_chart,
  # but depending on it does not put it in *this* package's dependency set, and
  # importing it here without declaring it trips depend_on_referenced_packages.
  # Keep the constraint aligned with boya_shared so pub resolves one copy.
  fl_chart: ^1.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
