name: boya_shared
description: Shared package for BOYA platform.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  go_router: ^14.0.0

  dio: ^5.11.1
  retrofit: ^4.9.2
  json_annotation: ^4.9.0

  freezed_annotation: ^3.0.0
