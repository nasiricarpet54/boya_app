  parsi_datetime_picker: ^0.0.2
  text_fa: ^1.0.0
  intl: ^0.20.2

  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  equatable: ^2.0.8

dev_dependencies:
