server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Permissions-Policy "geolocation=(self \"https://boya.bcshopir.ir\")" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|wasm|otf|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Flutter web headers
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
