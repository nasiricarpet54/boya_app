name: customer_app
description: Beauty Platform customer app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  boya_shared:
    path: ../shared
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.11.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  geolocator: ^14.0.3
  flutter_secure_storage: ^9.2.2
  neshan_maps_flutter: ^1.0.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/faq.json

# ✅ این بخش باید دقیقاً بدون فاصله در انتهای فایل باشد
dependency_overrides:
  intl: 0.20.2
