name: customer_app
description: Beauty Platform customer app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  boya_shared:
    path: ../shared
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  shared_preferences: ^2.2.3
  cached_network_image: ^4.0.3
  shimmer: ^4.0.0
  # Device GPS for the «موقعیت من» entry and the «نزدیک من» feed. Pinned to the
  # same constraint as boya_shared so pub resolves a single copy of the plugin.
  geolocator: ^14.0.3
  # Session storage. The refresh token is long-lived and single-use, so it lives
  # in the platform keystore (Keychain / EncryptedSharedPreferences) rather than
  # a readable preferences file. Constraint matches boya_shared so pub resolves
  # one copy of the plugin instead of two.
  flutter_secure_storage: ^11.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Static FAQ, bundled rather than fetched: it changes with releases, not per
    # user, so the support page loads instantly and works offline.
    - assets/faq.json
