# Production stack.
#
# Copy of docker-compose.staging.yml tuned for production:
#   - backend publishes ${BACKEND_PORT} (default 3021)
#   - Postgres and Redis are internal-only (no host ports published)
#   - Caddy publishes ${CADDY_HTTP_PORT}/${CADDY_HTTPS_PORT}
#   - backend reads its config from the repo-root .env (env_file)
#
#   1. cp .env.production.example .env  and set real secrets.
#   2. docker compose -f docker-compose.production.yml up -d --build
#
# The backend container always listens on 3000 internally; only the host
# mapping (BACKEND_PORT) changes. Database/Redis run on the compose-internal
# network and are unreachable from the host.

services:
  postgres:
    image: postgres:16-alpine
    container_name: boya_postgres_production
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-beauty}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      POSTGRES_DB: ${DATABASE_NAME:-beauty_platform}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=2GB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=128MB", "-c", "max_connections=50", "-c", "random_page_cost=1.1"]
    # Internal only — no host port published.
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-beauty} -d ${DATABASE_NAME:-beauty_platform}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: boya_redis_production
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Internal only — no host port published.
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the TypeORM migration chain. It runs in the builder stage
  # because `npm run migration:run` needs the TS sources + ts-node. The runtime
  # image deliberately does not ship them. data-source.migration.ts refuses to
  # run as beauty_app, so the master user (beauty) is used here.
  backend-migrate:
    build:
      context: ./backend
      target: builder
    container_name: boya_backend_migrate_production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_HOST: postgres
      DATABASE_MIGRATION_PORT: "5432"
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-beauty}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-change-me}
      DATABASE_MIGRATION_NAME: ${DATABASE_NAME:-beauty_platform}
    command: ["npm", "run", "migration:run"]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nasiricarpet/boya/boya-backend:latest}
    container_name: boya_backend_production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: api/v1
      # Neshan server-side reverse geocoding for the «موقعیت من» entry. Comes
      # from the repo-root .env; repeated here so a missing key is visible in the
      # compose file rather than only in the secret store. The endpoint answers
      # 503 while it is empty.
      NESHAN_API_KEY: ${NESHAN_API_KEY:-}
      # Persistent volume for uploaded images (salon cover, specialist avatar,
      # portfolio). Served statically at /uploads/.
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-3021}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');n.connect(3000,()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Admin panel — Next.js app served under the /admin subpath (next.config.js
  # basePath). Reachable only on the compose network; Caddy proxies /admin* to it.
  # NEXT_PUBLIC_API_URL is passed as a *build* arg because Next inlines it into
  # the client bundle at `next build` time, and again at runtime for SSR.
  admin:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_API_URL: https://boya.bcshopir.ir/api/v1
    container_name: boya_admin_production
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://boya.bcshopir.ir/api/v1

  # Customer Flutter Web app — the prebuilt web release served by nginx under
  # the /app subpath. Only reachable on the compose network; Caddy proxies
  # /app* to it. The web build must be produced with --base-href /app/.
  customer-web:
    build:
      context: ./mobile/customer_app
    container_name: boya_customer_web
    restart: unless-stopped
    expose:
      - "80"

  # Salon Flutter Web app — same static-nginx pattern as customer-web, served
  # under the /salon subpath. Build with --base-href /salon/.
  salon-web:
    build:
      context: ./mobile/salon_app
    container_name: boya_salon_web
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: boya_caddy_production
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_production_data:
  redis_production_data:
  caddy_data:
  caddy_config:
  uploads_data:
