# Production stack.
#
# Copy of docker-compose.staging.yml tuned for production:
#   - backend publishes ${BACKEND_PORT} (default 3021)
#   - Postgres and Redis are internal-only (no host ports published)
#   - Caddy publishes ${CADDY_HTTP_PORT}/${CADDY_HTTPS_PORT}
#   - backend reads its config from the repo-root .env (env_file)
#
#   1. cp .env.production.example .env  and set real secrets.
#   2. docker compose -f docker-compose.production.yml up -d --build
#
# The backend container always listens on 3000 internally; only the host
# mapping (BACKEND_PORT) changes. Database/Redis run on the compose-internal
# network and are unreachable from the host.

services:
  postgres:
    image: postgres:16-alpine
    container_name: boya_postgres_production
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-beauty}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      POSTGRES_DB: ${DATABASE_NAME:-beauty_platform}
    # Internal only — no host port published.
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-beauty} -d ${DATABASE_NAME:-beauty_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: boya_redis_production
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Internal only — no host port published.
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the TypeORM migration chain. It runs in the builder stage
  # because `npm run migration:run` needs the TS sources + ts-node. The runtime
  # image deliberately does not ship them. data-source.migration.ts refuses to
  # run as beauty_app, so the master user (beauty) is used here.
  backend-migrate:
    build:
      context: ./backend
      target: builder
    container_name: boya_backend_migrate_production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_HOST: postgres
      DATABASE_MIGRATION_PORT: "5432"
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-beauty}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-change-me}
      DATABASE_MIGRATION_NAME: ${DATABASE_NAME:-beauty_platform}
    command: ["npm", "run", "migration:run"]

  backend:
    build:
      context: ./backend
    container_name: boya_backend_production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: api/v1
    ports:
      - "${BACKEND_PORT:-3021}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');n.connect(3000,()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: boya_caddy_production
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_production_data:
  redis_production_data:
  caddy_data:
  caddy_config: