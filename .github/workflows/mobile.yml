name: Mobile

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - mobile/shared
          - mobile/customer_app
          - mobile/salon_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze