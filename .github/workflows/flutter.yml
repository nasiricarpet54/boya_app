name: flutter
on:
  push:
    paths: ['mobile/**']
  pull_request:
    paths: ['mobile/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, salon_app]
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.7.0'  # ← نسخه واقعی که Dart 3.7.0 را دارد
          cache: true

      - run: cd mobile/${{ matrix.app }} && flutter pub get
      - run: cd mobile/${{ matrix.app }} && flutter analyze --fatal-infos --fatal-warnings
      - run: cd mobile/${{ matrix.app }} && flutter test --reporter expanded
