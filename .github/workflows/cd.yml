name: CD Pipeline (Production Deploy)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================
  # Stage 1: Build & Push Docker Image
  # ============================================
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          tags: |
            ghcr.io/${{ github.repository }}/boya-backend:latest
            ghcr.io/${{ github.repository }}/boya-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Stage 2: Build Flutter Web Apps
  # ============================================
  build-flutter:
    name: Build Flutter Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_HOSTED_URL: https://pub.myket.ir
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # ✅ استفاده از Flutter 3.29.0 (شامل Dart 3.7)
          channel: 'stable'
          cache: false

      - name: Generate API Clients
        run: |
          cd mobile/shared
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Customer App
        run: |
          cd mobile/customer_app
          flutter pub get
          flutter build web --release --base-href /app/

      - name: Build Salon App
        run: |
          cd mobile/salon_app
          flutter pub get
          flutter build web --release --base-href /salon/

      - name: Prepare Artifacts
        run: |
          mkdir -p deploy_artifacts/customer_app
          mkdir -p deploy_artifacts/salon_app
          cp -r mobile/customer_app/build/web/* deploy_artifacts/customer_app/
          cp -r mobile/salon_app/build/web/* deploy_artifacts/salon_app/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-builds
          path: deploy_artifacts/
          retention-days: 3

  # ============================================
  # Stage 3: Deploy to Production Server
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-backend, build-flutter]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download Flutter Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-builds
          path: deploy_artifacts/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=== Step 1: Pull latest code ==="
            cd /opt/boya
            git fetch origin master
            git reset --hard origin/master

            echo "=== Step 2: Login to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Step 3: Pull new backend image ==="
            docker pull ghcr.io/${{ github.repository }}/boya-backend:${{ github.sha }}

            echo "=== Step 4: Update compose to use new image ==="
            export BACKEND_IMAGE="ghcr.io/${{ github.repository }}/boya-backend:${{ github.sha }}"
            sed -i "s|image:.*boya-backend.*|image: ${BACKEND_IMAGE}|" docker-compose.production.yml || true

            echo "=== Step 5: Rolling update backend (zero-downtime) ==="
            docker compose -f docker-compose.production.yml --env-file .env up -d --no-deps --scale backend=2 backend

            echo "=== Step 6: Wait for health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Backend healthy after ${i} attempts"
                break
              fi
              echo "Waiting for backend... (${i}/30)"
              sleep 5
            done

            if ! curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "❌ Health check failed! Rolling back..."
              docker compose -f docker-compose.production.yml --env-file .env down backend
              docker compose -f docker-compose.production.yml --env-file .env up -d backend
              exit 1
            fi

            echo "=== Step 7: Scale back to 1 instance ==="
            docker compose -f docker-compose.production.yml --env-file .env up -d --no-deps --scale backend=1 backend

            echo "=== Step 8: Cleanup old images ==="
            docker image prune -f

            echo "✅ Deployment complete!"