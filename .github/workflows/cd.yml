name: CD Pipeline (Production Deploy)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================
  # Stage 1: Build & Push Docker Image
  # ============================================
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          tags: |
            ghcr.io/${{ github.repository }}/boya-backend:latest
            ghcr.io/${{ github.repository }}/boya-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Stage 2: Build Flutter Web Apps
  # ============================================
  build-flutter:
    name: Build Flutter Web Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_HOSTED_URL: https://pub.myket.ir
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: false

      - name: Generate API Clients
        run: |
          cd mobile/shared
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Customer App
        run: |
          cd mobile/customer_app
          flutter pub get
          flutter build web --release --base-href /app/

      - name: Build Salon App
        run: |
          cd mobile/salon_app
          flutter pub get
          flutter build web --release --base-href /salon/

      - name: Prepare Artifacts
        run: |
          mkdir -p deploy_artifacts/customer_app
          mkdir -p deploy_artifacts/salon_app
          cp -r mobile/customer_app/build/web/* deploy_artifacts/customer_app/
          cp -r mobile/salon_app/build/web/* deploy_artifacts/salon_app/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-builds
          path: deploy_artifacts/
          retention-days: 3

  # ============================================
  # Stage 3: Deploy to Production Server
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-backend, build-flutter]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download Flutter Artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-builds
          path: deploy_artifacts/

      - name: Upload Flutter Artifacts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy_artifacts/"
          target: "/opt/boya/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=== Step 1: Pull latest code ==="
            cd /opt/boya
            git fetch origin master
            git reset --hard origin/master
            rm -rf mobile/customer_app/build/web mobile/salon_app/build/web
            mkdir -p mobile/customer_app/build/web mobile/salon_app/build/web
            cp -a deploy_artifacts/customer_app/. mobile/customer_app/build/web/
            cp -a deploy_artifacts/salon_app/. mobile/salon_app/build/web/
            rm -rf deploy_artifacts

            echo "=== Step 2: Login to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export BACKEND_IMAGE="ghcr.io/${{ github.repository }}/boya-backend:${{ github.sha }}"
            PREVIOUS_BACKEND_IMAGE=$(docker inspect --format '{{.Config.Image}}' boya_backend_production 2>/dev/null || true)
            echo "=== Step 3: Pull new backend image ==="
            docker pull "$BACKEND_IMAGE"

            echo "=== Step 4: Update backend ==="
            docker compose -f docker-compose.production.yml --env-file .env up -d --no-deps backend

            echo "=== Step 5: Wait for health check ==="
            HEALTH_URL="http://127.0.0.1:${BACKEND_PORT:-3021}/api/v1/health"
            for i in $(seq 1 30); do
              if curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
                echo "✅ Backend healthy after ${i} attempts"
                break
              fi
              echo "Waiting for backend... (${i}/30)"
              sleep 5
            done

            if ! curl -sf "$HEALTH_URL" > /dev/null 2>&1; then
              echo "❌ Health check failed! Rolling back..."
              if [ -n "$PREVIOUS_BACKEND_IMAGE" ]; then
                BACKEND_IMAGE="$PREVIOUS_BACKEND_IMAGE" docker compose -f docker-compose.production.yml --env-file .env up -d --no-deps backend
              else
                docker compose -f docker-compose.production.yml --env-file .env restart backend || true
              fi
              exit 1
            fi

            echo "=== Step 6: Cleanup old images ==="
            docker image prune -f

            echo "✅ Deployment complete!"
