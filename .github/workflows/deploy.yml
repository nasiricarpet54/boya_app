name: Boya Production CI/CD

on:
  push:
    branches: [ master ] # هر زمان که کدی در مستر پوش شود، این اکشن اجرا می‌شود

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate API Clients (build_runner)
        run: |
          cd mobile/shared
          flutter pub upgrade retrofit retrofit_generator build_runner json_serializable
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          
      - name: Build Salon Web
        run: |
          cd mobile/salon_app
          flutter pub get
          flutter build web --release --base-href /salon/

      - name: Build Customer Web
        run: |
          cd mobile/customer_app
          flutter pub get
          flutter build web --release --base-href /app/

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p deploy_artifacts/mobile/salon_app
          mkdir -p deploy_artifacts/mobile/customer_app
          mkdir -p deploy_artifacts/mobile/shared
          cp -r mobile/salon_app/build deploy_artifacts/mobile/salon_app/
          cp -r mobile/customer_app/build deploy_artifacts/mobile/customer_app/
          cp -r mobile/shared deploy_artifacts/mobile/

      - name: Transfer Artifacts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          # اگر از کلید خصوصی استفاده می‌کنید خط بالا را پاک کرده و خط زیر را فعال کنید:
          # key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy_artifacts/*"
          target: "/opt/boya/temp_deploy"
          strip_components: 1

      - name: Execute Deployment on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          # key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/boya
            
            # ۱. دریافت آخرین تغییرات کدهای بک‌اند
            git pull origin master
            
            # ۲. جایگزینی فایل‌های کامپایل‌شده فلاتر که از گیت‌هاب ارسال شده‌اند
            cp -r /opt/boya/temp_deploy/mobile/* /opt/boya/mobile/
            rm -rf /opt/boya/temp_deploy
            
            # ۳. ری‌بیلد و راه‌اندازی مجدد کانتینرها (بدون نیاز به بیلد فلاتر روی سرور)
            docker compose -f docker-compose.production.yml --env-file .env up --build -d
            
            # ۴. پاک‌سازی ایمیج‌های قدیمی برای جلوگیری از پر شدن هارد سرور
            docker image prune -f
