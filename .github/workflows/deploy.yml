name: Auto Deploy to Production VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: customer_app
            base_href: /app/
          - app: salon_app
            base_href: /salon/
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Build Flutter Web
        run: |
          cd mobile/${{ matrix.app }}
          flutter pub get
          flutter build web --release --base-href '${{ matrix.base_href }}' --no-web-resources-cdn --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ matrix.app }}
          path: mobile/${{ matrix.app }}/build/web

  deploy:
    needs: build_web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download customer_app build
        uses: actions/download-artifact@v4
        with:
          name: web-build-customer_app
          path: mobile/customer_app/build/web
      - name: Download salon_app build
        uses: actions/download-artifact@v4
        with:
          name: web-build-salon_app
          path: mobile/salon_app/build/web
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/boya-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/boya-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/boya-ssh/id_ed25519"
          ssh-keyscan -p 9011 -H "$VPS_HOST" > "$RUNNER_TEMP/boya-ssh/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/boya-ssh/known_hosts"
          {
            echo "BOYA_SSH_KEY=$RUNNER_TEMP/boya-ssh/id_ed25519"
            echo "BOYA_SSH_KNOWN_HOSTS=$RUNNER_TEMP/boya-ssh/known_hosts"
          } >> "$GITHUB_ENV"
      - name: Verify SSH authentication to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="$VPS_USER@$VPS_HOST"
          ssh_args=(-i "$BOYA_SSH_KEY" -p 9011 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BOYA_SSH_KNOWN_HOSTS")
          if timeout 30s ssh "${ssh_args[@]}" "$remote" 'printf "SSH authenticated as "; id -un'; then
            exit 0
          fi
          echo 'SSH smoke test failed; retrying once with verbose handshake diagnostics.'
          timeout 30s ssh -vvv "${ssh_args[@]}" "$remote" true || true
          exit 1
      - name: Stream and validate web builds on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="$VPS_USER@$VPS_HOST"
          stage="/opt/boya/.deploy-staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_args=(-i "$BOYA_SSH_KEY" -p 9011 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BOYA_SSH_KNOWN_HOSTS")
          ssh "${ssh_args[@]}" "$remote" "mkdir -p '$stage/customer_app' '$stage/salon_app'"
          for app in customer_app salon_app; do
            test -s "mobile/$app/build/web/index.html"
            tar -C "mobile/$app/build" -czf - web | ssh "${ssh_args[@]}" "$remote" "tar -xzf - -C '$stage/$app'"
          done
          ssh "${ssh_args[@]}" "$remote" "test -s '$stage/customer_app/web/index.html' && test -s '$stage/salon_app/web/index.html'"
      - name: Install validated builds and run production update
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="$VPS_USER@$VPS_HOST"
          stage="/opt/boya/.deploy-staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i "$BOYA_SSH_KEY" -p 9011 -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BOYA_SSH_KNOWN_HOSTS" "$remote" "set -eu
            cd /opt/boya
            for app in customer_app salon_app; do
              mkdir -p \"mobile/\$app/build\"
              backup=\"mobile/\$app/build/web.previous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"
              rm -rf \"\$backup\"
              if [ -d \"mobile/\$app/build/web\" ]; then mv \"mobile/\$app/build/web\" \"\$backup\"; fi
              mv "$stage/\$app/web" "mobile/\$app/build/web"
            done
            rm -rf '$stage'
            bash update_sop.sh
            for app in customer_app salon_app; do
              rm -rf "mobile/\$app/build/web.previous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            done"
