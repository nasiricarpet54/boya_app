name: CI Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
  workflow_dispatch: # ✅ اضافه کردن این خط

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Backend (NestJS) - Lint + Test
  # ============================================
  backend-test:
    name: Backend Test (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: boya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --coverage --passWithNoTests
      - run: npm run build
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/boya_test

  # ============================================
  # Flutter Shared - Code Gen + Analyze + Test
  # ============================================
  flutter-shared:
    name: Flutter Shared (Code Gen + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/shared
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: false
      - run: flutter pub get
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated files
        run: |
          if git diff --quiet; then
            echo "✅ Generated files are up to date"
          else
            echo "❌ Generated .g.dart files are NOT committed!"
            git diff --stat
            exit 1
          fi
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage --reporter expanded

  # ============================================
  # Flutter Customer App - Analyze + Test + Build
  # ============================================
  flutter-customer:
    name: Flutter Customer App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: flutter-shared
    defaults:
      run:
        working-directory: mobile/customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: false
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage --reporter expanded
      - name: Build Web
        run: flutter build web --release --base-href /app/

  # ============================================
  # Flutter Salon App - Analyze + Test + Build
  # ============================================
  flutter-salon:
    name: Flutter Salon App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: flutter-shared
    defaults:
      run:
        working-directory: mobile/salon_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: 'stable'
          cache: false
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test --coverage --reporter expanded
      - name: Build Web
        run: flutter build web --release --base-href /salon/

  # ============================================
  # Docker Build Verification (no push)
  # ============================================
  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -f backend/Dockerfile -t boya-backend:test ./backend
      - name: Verify Image
        run: docker run --rm boya-backend:test node -e "console.log('OK')"
