name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres + Redis back the integration suite. The init script is mounted the
    # same way docker-compose.yml mounts it, so `beauty_app` exists with
    # NOBYPASSRLS and the RLS isolation specs run against a realistic cluster.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: beauty_platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beauty -d beauty_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        volumes:
          - ${{ github.workspace }}/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point the harness at the service containers above.
      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      DATABASE_USER: beauty
      DATABASE_PASSWORD: change-me
      DATABASE_NAME: beauty_platform
      DATABASE_MIGRATION_USER: beauty
      DATABASE_MIGRATION_PASSWORD: change-me
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      INTEGRATION_DB_REQUIRED: "true"
      # Non-secret test values: the suite must never reach a real SMS provider or
      # a real payment gateway. OTP_DEV_MODE=false keeps OTP verification real.
      JWT_ACCESS_SECRET: ci-test-access
      JWT_REFRESH_SECRET: ci-test-refresh
      MELIPAYAMAK_USERNAME: test
      MELIPAYAMAK_PASSWORD: test
      OTP_PEPPER: test-pepper
      OTP_DEV_MODE: "false"
      PAYMENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Migrates the development database. The integration harness migrates its own
      # `beauty_platform_test` in globalSetup, so this step is a separate guard:
      # it proves the chain still applies cleanly to a fresh database.
      - run: npm run migration:run
      # Unit tests (TZ is pinned inside jest via test/setup/unit-tz.setup.ts).
      - run: npm test
      # Integration tests: RLS isolation, booking exclusion and policy GUC.
      # The harness creates `beauty_platform_test`, migrates it and skips only
      # when Postgres is unreachable.
      - run: npm run test:integration
      # e2e specs compile to dist-test via tsconfig.test.json and run on node --test.
      - run: npm run test:e2e
